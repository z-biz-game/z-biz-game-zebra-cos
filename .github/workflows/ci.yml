name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install: zero runtime dependencies and no build step. Pulling a package graph
      # into CI to prove nothing is how a repo starts failing on a network flake.
      - name: Syntax check every source
        run: |
          for f in $(git ls-files 'js/*.js' 'js/*/*.js'); do node --check "$f" || exit 1; done
          for f in $(git ls-files 'tools/*.mjs'); do node --check "$f" || exit 1; done
          for f in $(git ls-files 'test/*.mjs'); do node --check "$f" || exit 1; done
          node --check server.cjs

      # The layering invariant: `js/` ships to the browser, `tools/` does not. A runtime module
      # importing tools/ is either a 404 in production or bench code served as product code —
      # and then no gate below can be read as "the shipped bundle is the tested code".
      - name: js/ never imports tools/
        run: |
          if grep -rnE "(import|export)[^;]*from '[^']*tools/" js/ ; then
            echo '::error::运行时模块（js/）去够了 tools/ —— 分层又倒了'
            exit 1
          fi

      - name: Entry file really wires the engine
        run: |
          grep -q '<canvas' index.html
          grep -q 'js/main.js' index.html
          grep -q './engine/generate.js' js/main.js

      #  unit tests：改动时最想立刻看见的那几条（每种线索的语义、stopped 的读法、跨进程复现）。
      - name: Unit tests (node --test)
        run: node --test test/

      # 三道定义闸。数字是契约：rule-test 1353 / counter-test 285 / pencil-test 31（本机
      # 2026-09-28 实跑），红了先读 Reason 行，不要去看退出码就好。
      - name: Rule tests (legal-board definition, 11 clue kinds pinned twice)
        run: node tools/rule-test.mjs

      - name: Counter tests (referee vs. propagation-free witness, stopped semantics)
        run: node tools/counter-test.mjs

      - name: Pencil tests (every deduction audited against ground truth)
        run: node tools/pencil-test.mjs

      # 难度实测台：TIERS[].band 与 TIERS[].budgetMs 是**这张表**回填出来的选择目标。
      # 一档不再落在自己的 band 里、出货盘推不完、裁判被预算掐断、见证与裁判分歧 —— 都红。
      # 24 是 CI 的抽样量（本机 2026-09-28 实测 SAMPLES=24 时 72/72 张出货）；
      # 重抄 band/budgetMs 要用 SAMPLES=60。
      - name: Balance gate (measured ladder, uniqueness, cost)
        env:
          SAMPLES: "24"
        run: node tools/balance.mjs
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # 阶段二的第五道闸（前四道是 rule-test / counter-test / pencil-test / balance）：真 headless Chrome、
  # 真 DOM、真画布像素、真 localStorage、真指针与真焦点。
  # 它跑**两种 URL 形态**（tools/verify.sh:3-7）：仓库自己当文档根的 root 形态，和 Pages 的
  # `/<repo>/` 前缀形态（verify.sh:16-20 写着为什么只有后者看得见页级 `/js/...` 说明符解到域名根上）。
  # 本机实跑 2026-09-28（Chrome 154.0.8037.57 · node v26.8.1 · loadavg 起 { 9.60 7.91 5.84 }）：
  # root 15/15 段 · 413 checks · 0 failed · 15 s ⇒ prefix 15/15 · 413 · 0 failed · 14 s ——
  # 15 段 = 12 段注册场景 + urlseed 三趟，少一段交回结果 verify.sh 就判红
  # （verify.sh:107 的 WANT_N 是注册表决定的，不是"跑完了就算"）。
  browser:
    name: real browser gate (both URL shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # 22，不是上面 check job 用的 20：tools/playtest.cjs 是裸 CDP 驱动，用的 node 全局
        # WebSocket/fetch（playtest.cjs:1 头上那句、:81 的 /json/version、:93 的 webSocketDebuggerUrl）
        # 只在 node ≥22 存在。20 上第一条 attach 就 "WebSocket is not defined"，在第一条断言
        # 之前整个 job 就红了 —— 那种红和这个游戏没有任何关系。
        with:
          node-version: 22
      # ubuntu-latest 的镜像自带 google-chrome 并在 PATH 上，正是 verify.sh 在两条 macOS bundle
      # 路径之后找的那个名字（verify.sh:54-60）。**不装**：pinned 镜像上的 apt/dpkg 是一次网络抖动
      # 的来源，一旦它死了，读数会被读成"游戏坏了"而其实改动一行都没碰游戏。
      # python3 是 verify.sh 自己要求的（结果解析 + 前缀形态的静态服务器，verify.sh:61），
      # ubuntu-latest 也自带。
      #
      # 不要加 --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader：这个闸有一半的
      # 断言在把画布像素读回来（深色像素计数、✗ 的棕色墨 #6b4a2f、提示高亮的红/绿调、逐位相同的
      # 撤销对账），软件光栅化会让这些读数说谎（verify.sh:31-33）。
      # 窄屏那一腿（390×844）用 Emulation.setDeviceMetricsOverride 在第一次导航之前钉住视口，
      # 是 CDP 层的覆盖 ⇒ 不需要 xorg、不需要窗口管理器。
      - name: Browser gate (root + prefix)
        env:
          # verify.sh 自己的看门狗默认值。本机两形态合计 ~27 s，这里是共享 runner 的余量，
          # 不是闸用来打分的预算：把它调大不会让一条红的闸变绿，只能让看门狗别砍掉一条只是慢的跑。
          WD_TIMEOUT: 900
        run: bash tools/verify.sh

